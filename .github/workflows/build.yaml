name: README build

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: # This adds the manual "Run workflow" button to your Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Already on latest v4
        with:
          fetch-depth: 1

      - name: Get Python 3.11
        uses: actions/setup-python@v5 # Already on latest v5
        with:
          python-version: '3.11'

      - name: Configure pip cache
        uses: actions/cache@v4 # Already on latest v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/cache/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt

      - name: Update README file
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: python today.py

      - name: Commit
        run: |-
          git add .
          git diff
          # Using generic GitHub Actions bot for a cleaner, professional history
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git commit -m "Updated professional README stats" -a || echo "No changes to commit"
          git push
